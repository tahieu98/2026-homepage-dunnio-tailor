<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">Ngân sách chiều cao ở viewport 1920 × 900 CSS px</title><desc id="desc">Hockerty có đáy hero tại 950px, Dunnio v3.2 bản đo 3:2 có đáy hero và nút tại 1414px. Đề xuất dành 80px cho header, 756px cho ảnh, 64px cho nút: tổng 900px.</desc><rect width="1120" height="610" rx="16" fill="#f4f5f7"/><g font-family="Arial,sans-serif" fill="#0b1f3a"><text x="32" y="40" font-size="24" font-weight="700">Cùng một cửa sổ 1920 × 900 CSS px</text><text x="32" y="68" font-size="16">Nét đứt = đáy màn hình đầu tiên. Số đo làm tròn; không biểu diễn tỉ lệ chiều ngang của ảnh.</text><g><text x="40" y="108" font-size="20" font-weight="700">Hockerty đang chạy</text><rect x="40" y="130" width="300" height="225" fill="#fff" stroke="#8391a2"/><rect x="40" y="130" width="300" height="12.5" fill="#0b1f3a"/><rect x="40" y="142.5" width="300" height="225" fill="#c8a96a"/><text x="54" y="192.5" font-size="19">Khung ảnh 900px</text><text x="54" y="221.5" font-size="15">Phần trên 50px</text><line x1="35" y1="355" x2="345" y2="355" stroke="#ad3232" stroke-width="2" stroke-dasharray="7 5"/><text x="40" y="395.5" font-size="17" font-weight="700">Đáy khối: 950px</text><text x="40" y="420.5" font-size="15">Còn 50px dưới màn hình đầu</text></g><g><text x="405" y="108" font-size="20" font-weight="700">Dunnio v3.2 bản đo 3:2</text><rect x="405" y="130" width="300" height="225" fill="#fff" stroke="#8391a2"/><rect x="405" y="130" width="300" height="20" fill="#0b1f3a"/><rect x="405" y="150" width="300" height="317.5" fill="#c8a96a"/><rect x="405" y="467.5" width="300" height="16" fill="#75879d"/><text x="419" y="200" font-size="19">Khung ảnh 1270px</text><text x="419" y="229" font-size="15">Phần trên 80px · nút 64px</text><line x1="400" y1="355" x2="710" y2="355" stroke="#ad3232" stroke-width="2" stroke-dasharray="7 5"/><text x="405" y="511.5" font-size="17" font-weight="700">Đáy khối: 1414px</text><text x="405" y="536.5" font-size="15">Còn 514px dưới màn hình đầu</text></g><g><text x="770" y="108" font-size="20" font-weight="700">Ngân sách đề xuất</text><rect x="770" y="130" width="300" height="225" fill="#fff" stroke="#8391a2"/><rect x="770" y="130" width="300" height="20" fill="#0b1f3a"/><rect x="770" y="150" width="300" height="189" fill="#c8a96a"/><rect x="770" y="339" width="300" height="16" fill="#75879d"/><text x="784" y="200" font-size="19">Khung ảnh 756px</text><text x="784" y="229" font-size="15">Phần trên 80px · nút 64px</text><line x1="765" y1="355" x2="1075" y2="355" stroke="#ad3232" stroke-width="2" stroke-dasharray="7 5"/><text x="770" y="390" font-size="17" font-weight="700">Đáy khối: 900px</text><text x="770" y="415" font-size="15">Ảnh + nút nằm trong màn hình đầu</text></g><text x="32" y="592" font-size="13">Dunnio: header 80px nằm ngoài ảnh; Hockerty: promo 50px nằm ngoài ảnh, menu nằm đè lên ảnh.</text></g></svg>